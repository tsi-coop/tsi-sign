<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Platform Users — TSI Sign Admin Console</title>
    <link rel="stylesheet" href="assets/console.css">
</head>
<body>
    <header class="mobilebar">
        <a class="brand" href="apps.html"><span class="mark">TS</span><span>TSI Sign</span></a>
    </header>
    <div class="app">
        <aside class="side">
            <a class="brand" href="apps.html"><span class="mark">TS</span><span>TSI Sign</span></a>
            <nav class="nav">
                <a href="apps.html">Apps</a>
                <a href="legal-evidence.html">Legal Evidence</a>
                <a href="platform-users.html" class="active platform-admin-only">Platform Users</a>
            </nav>
            <div class="side-foot">
                <div class="side-user-row">
                    <div id="sidebar-user-avatar" class="avatar">–</div>
                    <div style="min-width:0; flex:1;">
                        <div id="sidebar-user-name" class="side-user-name"></div>
                        <div id="sidebar-user-role" class="side-user-role"></div>
                    </div>
                </div>
                <a href="#" onclick="logout(); return false;" class="signout">Sign Out</a>
            </div>
        </aside>

        <main class="main">
        <div class="eyebrow">Admin Console</div>
        <h1>Platform Users &amp; Roles</h1>
        <p class="subtitle">Internal ops/admin accounts. Platform Admin only.</p>

        <div id="notice" class="notice error" style="display:none;"></div>

        <div class="panel">
            <table>
                <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>App Scope</th><th></th></tr></thead>
                <tbody id="users-body"><tr><td colspan="6" class="muted">Loading…</td></tr></tbody>
            </table>
        </div>

        <h2>Create Platform User</h2>
        <div class="panel">
            <form id="create-form">
                <div class="row">
                    <div>
                        <label>Full name</label>
                        <input type="text" id="user-name" required>
                    </div>
                    <div>
                        <label>Email</label>
                        <input type="email" id="user-email" required>
                    </div>
                </div>
                <div class="row">
                    <div>
                        <label>Initial password (min. 8 characters)</label>
                        <input type="password" id="user-password" minlength="8" required>
                    </div>
                    <div>
                        <label>Role</label>
                        <select id="user-role">
                            <option value="APP_MANAGER">APP_MANAGER</option>
                            <option value="AUDITOR">AUDITOR</option>
                            <option value="PLATFORM_ADMIN">PLATFORM_ADMIN</option>
                        </select>
                    </div>
                </div>
                <div style="margin-top:16px;"><button type="submit">Create User</button></div>
            </form>
        </div>

        <div class="panel" id="scope-panel" style="display:none;">
            <h2 style="margin-top:0;">App Scope — <span id="scope-user-name"></span></h2>
            <p class="muted">Which Apps this APP_MANAGER administers (writes app_admins).</p>
            <div id="scope-checkboxes"></div>
            <div style="margin-top:16px;"><button class="secondary" id="scope-close-btn" type="button">Close</button></div>
        </div>
        </main>
    </div>

    <script src="assets/console.js"></script>
    <script>
        const notice = document.getElementById("notice");
        loadTopbar();

        let usersCache = [];
        let appsCache = [];

        async function loadUsers() {
            usersCache = await tsiCall("/api/v1/admin/platform-users", "list_users", {});
            const body = document.getElementById("users-body");
            body.innerHTML = usersCache.map(u => `
                <tr>
                    <td>${escapeHtml(u.fullName)}</td>
                    <td>${escapeHtml(u.email)}</td>
                    <td>${escapeHtml(u.role)}</td>
                    <td><span class="badge ${u.isActive ? "active" : "inactive"}">${u.isActive ? "Active" : "Inactive"}</span></td>
                    <td>${u.role === "APP_MANAGER" ? `<button class="secondary" onclick="openScope('${u.userId}')">Manage</button>` : '<span class="muted">—</span>'}</td>
                    <td>${u.isActive ? `<button class="danger" onclick="deactivate('${u.userId}')">Deactivate</button>` : `<button class="secondary" onclick="activate('${u.userId}')">Activate</button>`}</td>
                </tr>`).join("");
        }

        async function deactivate(userId) {
            try {
                await tsiCall("/api/v1/admin/platform-users", "deactivate_user", { userId });
                loadUsers();
            } catch (err) {
                showNotice(notice, err.message);
            }
        }

        async function activate(userId) {
            try {
                await tsiCall("/api/v1/admin/platform-users", "activate_user", { userId });
                loadUsers();
            } catch (err) {
                showNotice(notice, err.message);
            }
        }

        document.getElementById("create-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            try {
                await tsiCall("/api/v1/admin/platform-users", "create_user", {
                    fullName: document.getElementById("user-name").value,
                    email: document.getElementById("user-email").value,
                    password: document.getElementById("user-password").value,
                    role: document.getElementById("user-role").value
                });
                document.getElementById("create-form").reset();
                loadUsers();
            } catch (err) {
                showNotice(notice, err.message);
            }
        });

        async function openScope(userId) {
            const user = usersCache.find(u => u.userId === userId);
            document.getElementById("scope-user-name").textContent = user.fullName;
            if (appsCache.length === 0) {
                appsCache = await tsiCall("/api/v1/admin/apps", "list_apps", {});
            }
            const assigned = new Set(await tsiCall("/api/v1/admin/platform-users", "list_user_apps", { userId }));

            const container = document.getElementById("scope-checkboxes");
            container.innerHTML = appsCache.map(a => `
                <label style="display:flex; align-items:center; gap:8px; margin:8px 0;">
                    <input type="checkbox" data-app-id="${escapeHtml(a.appId)}" ${assigned.has(a.appId) ? "checked" : ""}>
                    ${escapeHtml(a.appName)} <span class="muted">(${escapeHtml(a.appSlug)})</span>
                </label>`).join("");

            container.querySelectorAll("input[type=checkbox]").forEach(cb => {
                cb.addEventListener("change", async () => {
                    try {
                        await tsiCall("/api/v1/admin/platform-users", "update_user_app_assignment", {
                            userId, appId: cb.dataset.appId, assign: cb.checked
                        });
                    } catch (err) {
                        showNotice(notice, err.message);
                        cb.checked = !cb.checked;
                    }
                });
            });

            document.getElementById("scope-panel").style.display = "block";
            document.getElementById("scope-panel").scrollIntoView({ behavior: "smooth" });
        }

        document.getElementById("scope-close-btn").addEventListener("click", () => {
            document.getElementById("scope-panel").style.display = "none";
        });

        loadUsers().catch(err => showNotice(notice, err.message));
    </script>
</body>
</html>
