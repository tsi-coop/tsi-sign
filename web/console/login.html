<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSI Sign Admin Console</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        :root{--ink:#172033;--muted:#607086;--line:#d9e2ec;--wash:#f3f7f8;--teal:#006a67;--red:#b42318}
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--ink);background:var(--wash);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
        .brand{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:32px;text-align:center}
        .brand-row{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800;color:var(--ink)}
        .brand-tag{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.01em}
        .mark{width:40px;height:40px;border-radius:10px;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px;flex-shrink:0}
        .card{background:#fff;border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:14px;padding:32px;width:100%;max-width:420px}
        .card h1{margin:0 0 6px;font-size:20px;font-weight:900}
        .card .sub{color:var(--muted);font-size:13px;margin:0 0 22px;line-height:1.5}
        .field{margin-bottom:18px}
        .field label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
        .field input{width:100%;height:42px;border:1px solid var(--line);border-radius:7px;padding:0 12px;font-size:13.5px;font-family:inherit;color:var(--ink);background:#fff;outline:none;transition:border-color .15s}
        .field input:focus{border-color:var(--teal)}
        .notice{display:none;margin-bottom:14px;padding:10px 14px;border-radius:7px;background:#fef2f2;border:1px solid #fde8e8;font-size:12px;font-weight:600;color:var(--red)}
        .btn{width:100%;height:44px;background:var(--teal);color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s;font-family:inherit}
        .btn:hover{background:#005450}
        .btn:disabled{opacity:.6;cursor:not-allowed}
    </style>
</head>
<body>

<div class="brand">
    <div class="brand-row">
        <span class="mark">TS</span>
        <span>TSI Sign</span>
    </div>
    <span class="brand-tag">Document signing &amp; sealing engine.</span>
</div>

<div class="card">
    <div id="notice" class="notice"></div>

    <form id="setup-form" style="display:none;">
        <h1>First-Time Setup</h1>
        <p class="sub">No platform admin exists yet. Create the first one to continue.</p>
        <div class="field">
            <label for="setup-name">Full name</label>
            <input type="text" id="setup-name" required>
        </div>
        <div class="field">
            <label for="setup-email">Email</label>
            <input type="email" id="setup-email" required>
        </div>
        <div class="field">
            <label for="setup-password">Password (min. 8 characters)</label>
            <input type="password" id="setup-password" minlength="8" required>
        </div>
        <button type="submit" class="btn">Create admin account</button>
    </form>

    <form id="login-form" style="display:none;">
        <h1>Sign In</h1>
        <p class="sub">Admin Console</p>
        <div class="field">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" required autocomplete="email">
        </div>
        <div class="field">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn">Sign In</button>
    </form>
</div>

<script src="assets/console.js"></script>
<script>
    const notice = document.getElementById("notice");

    (async function init() {
        try {
            const status = await tsiCall("/api/v1/admin/setup", "setup_status", {}, true);
            document.getElementById(status.initialized ? "login-form" : "setup-form").style.display = "block";
        } catch (err) {
            showNotice(notice, err.message);
        }
    })();

    document.getElementById("setup-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
            const fullName = document.getElementById("setup-name").value;
            const email = document.getElementById("setup-email").value;
            const password = document.getElementById("setup-password").value;
            await tsiCall("/api/v1/admin/setup", "setup", { fullName, email, password }, true);
            await tsiCall("/api/v1/admin/auth", "login", { email, password }, true);
            window.location.href = "apps.html";
        } catch (err) {
            showNotice(notice, err.message);
        }
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;
            await tsiCall("/api/v1/admin/auth", "login", { email, password }, true);
            window.location.href = "apps.html";
        } catch (err) {
            showNotice(notice, err.message);
        }
    });
</script>
</body>
</html>
