<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Apps — TSI Sign Admin Console</title>
    <link rel="stylesheet" href="assets/console.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">TSI Sign</div>
        <nav>
            <a href="apps.html" class="active">Apps</a>
            <a href="legal-evidence.html">Legal Evidence</a>
            <a href="platform-users.html" class="platform-admin-only">Platform Users</a>
            <span id="topbar-user" class="muted" style="margin-right:16px;"></span>
            <a href="#" onclick="logout(); return false;">Log out</a>
        </nav>
    </header>

    <main>
        <h1>Apps</h1>
        <p class="subtitle">Each App is an isolated consumer of the TSI Sign engine — its own API key, template namespace, and signer pool.</p>

        <div class="panel">
            <div id="notice" class="notice error" style="display:none;"></div>
            <table>
                <thead><tr><th>Name</th><th>Slug</th><th>Status</th><th>Default Provider</th><th>Created</th></tr></thead>
                <tbody id="apps-body"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
            </table>
        </div>

        <h2 class="platform-admin-only">Create App</h2>
        <div class="panel platform-admin-only">
            <form id="create-form">
                <div class="row">
                    <div>
                        <label>App name</label>
                        <input type="text" id="app-name" required placeholder="Loan App">
                    </div>
                    <div>
                        <label>App slug (unique, lowercase, e.g. loan-app)</label>
                        <input type="text" id="app-slug" required placeholder="loan-app" pattern="[a-z0-9\-]+">
                    </div>
                </div>
                <div class="row">
                    <div>
                        <label>Default provider ID (optional)</label>
                        <input type="text" id="app-provider" placeholder="local_pki">
                    </div>
                    <div>
                        <label>Default key alias (optional)</label>
                        <input type="text" id="app-key-alias" placeholder="tsi_corporate_seal">
                    </div>
                </div>
                <div style="margin-top:16px;"><button type="submit">Create App</button></div>
            </form>
            <div id="new-key-notice" class="notice key" style="display:none;"></div>
        </div>
    </main>

    <script src="assets/console.js"></script>
    <script>
        const notice = document.getElementById("notice");
        loadTopbar();

        async function loadApps() {
            try {
                const apps = await apiJson("/api/v1/admin/apps");
                const body = document.getElementById("apps-body");
                if (apps.length === 0) {
                    body.innerHTML = '<tr><td colspan="5" class="muted">No Apps yet — create one below.</td></tr>';
                    return;
                }
                body.innerHTML = apps.map(a => `
                    <tr>
                        <td><a href="app-detail.html?appId=${encodeURIComponent(a.appId)}">${escapeHtml(a.appName)}</a></td>
                        <td>${escapeHtml(a.appSlug)}</td>
                        <td><span class="badge ${a.isActive ? "active" : "inactive"}">${a.isActive ? "Active" : "Inactive"}</span></td>
                        <td>${escapeHtml(a.defaultProviderId) || '<span class="muted">—</span>'}</td>
                        <td class="muted">${escapeHtml(a.createdAt)}</td>
                    </tr>
                `).join("");
            } catch (err) {
                showNotice(notice, err.message);
            }
        }

        document.getElementById("create-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            showNotice(notice, "");
            try {
                const result = await apiJson("/api/v1/admin/apps", {
                    method: "POST",
                    body: JSON.stringify({
                        appName: document.getElementById("app-name").value,
                        appSlug: document.getElementById("app-slug").value,
                        defaultProviderId: document.getElementById("app-provider").value || null,
                        defaultKeyAlias: document.getElementById("app-key-alias").value || null
                    })
                });
                const keyNotice = document.getElementById("new-key-notice");
                keyNotice.style.display = "block";
                keyNotice.textContent = "App created. API key (shown once): " + result.apiKey;
                document.getElementById("create-form").reset();
                loadApps();
            } catch (err) {
                showNotice(notice, err.message);
            }
        });

        loadApps();
    </script>
</body>
</html>
