<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Documents - TSI Sign Admin Console</title>
    <link rel="stylesheet" href="assets/console.css">
</head>
<body>
    <header class="mobilebar">
        <a class="brand" href="dashboard.html"><span class="mark">TS</span><span>TSI Sign</span></a>
    </header>
    <div class="app">
        <aside class="side">
            <a class="brand" href="dashboard.html"><span class="mark">TS</span><span>TSI Sign</span></a>
            <nav class="nav">
                <a href="dashboard.html">Dashboard</a>
                <a href="apps.html">Apps</a>
                <a href="templates.html">Templates</a>
                <a href="documents.html" class="active">Documents</a>
                <a href="legal-evidence.html">Legal</a>
                <a href="audit.html">Audit</a>
                <a href="users.html" class="platform-admin-only">Users</a>
                <a href="system-settings.html" class="platform-admin-only">Settings</a>
            </nav>
            <div class="side-foot">
                <div class="side-user-row">
                    <div id="sidebar-user-avatar" class="avatar">-</div>
                    <div style="min-width:0; flex:1;">
                        <div id="sidebar-user-name" class="side-user-name"></div>
                        <div id="sidebar-user-role" class="side-user-role"></div>
                    </div>
                </div>
                <a href="#" onclick="logout(); return false;" class="signout">Sign Out</a>
            </div>
        </aside>

        <main class="main">
        <div class="page-head">
            <div>
                <h1>Documents</h1>
                <p class="subtitle">Generated and uploaded documents, scoped to one App at a time.</p>
            </div>
            <button id="new-document-btn">+ New Document</button>
        </div>

        <div id="notice" class="notice error" style="display:none;"></div>

        <div class="panel">
            <div class="row">
                <div>
                    <label>App</label>
                    <select id="app-select"></select>
                </div>
                <div>
                    <label>Search</label>
                    <input type="search" id="search-input" placeholder="Search by title...">
                </div>
                <div>
                    <label>&nbsp;</label>
                    <label style="font-weight:normal;"><input type="checkbox" id="show-archived-checkbox"> Show archived</label>
                </div>
            </div>
        </div>

        <div id="content" style="display:none;">
            <div class="panel">
                <table>
                    <thead><tr><th>Title</th><th>Template</th><th>Status</th><th>Created</th><th></th></tr></thead>
                    <tbody id="documents-body"><tr><td colspan="5" class="muted">Loading...</td></tr></tbody>
                </table>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px;">
                    <span id="documents-page-info" class="muted"></span>
                    <span id="documents-page-btns"></span>
                </div>
            </div>
        </div>

        <div id="empty-state" class="panel" style="display:none;">
            <p class="muted">No Apps yet. <a href="apps.html">Create one</a> first.</p>
        </div>
        </main>
    </div>

    <!-- New Document modal -->
    <div class="modal-overlay" id="create-modal">
        <div class="modal wide">
            <h2>New Document</h2>

            <div class="tab-panel active" id="doc-tab-generate">
                <form id="generate-document-form">
                    <div class="field"><label>Template</label><select id="gen-doc-template" required></select></div>
                    <div class="field"><label>Document title</label><input type="text" id="gen-doc-title" required placeholder="Offer Letter - Jane Doe.pdf"></div>
                    <div class="field"><label>Payload data (JSON)</label><textarea id="gen-doc-payload">{ }</textarea></div>
                    <div id="generate-document-notice" class="notice error" style="display:none;"></div>
                    <div class="modal-actions">
                        <button type="button" onclick="closeModal('create-modal')">Cancel</button>
                        <button type="submit">Generate</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="assets/console.js"></script>
    <script>
        const notice = document.getElementById("notice");
        loadTopbar();

        let appId = qs("appId");
        let templatesCache = [];

        function selectApp(newAppId) {
            window.location.href = "documents.html?appId=" + encodeURIComponent(newAppId);
        }

        async function loadTemplatesForSelect() {
            templatesCache = (await tsiCall("/api/v1/templates", "list_templates", { appId, limit: 500 })).templates;
            const activeTemplates = templatesCache.filter(t => t.active);
            const select = document.getElementById("gen-doc-template");
            select.innerHTML = activeTemplates.length === 0
                ? '<option value="">Create a template first</option>'
                : activeTemplates.map(t => `<option value="${escapeHtml(t.templateId)}">${escapeHtml(t.templateName)}</option>`).join("");
        }

        let documentsPage = 1;

        async function loadDocuments(page) {
            documentsPage = page || 1;
            const includeArchived = document.getElementById("show-archived-checkbox").checked;
            const search = document.getElementById("search-input").value.trim();
            const result = await tsiCall("/api/v1/documents", "list_documents", {
                appId, includeArchived, search: search || undefined, page: documentsPage, limit: 20
            });
            const body = document.getElementById("documents-body");
            body.innerHTML = result.documents.length === 0
                ? '<tr><td colspan="5" class="muted">No documents yet.</td></tr>'
                : result.documents.map(d => `
                    <tr>
                        <td><a href="document-detail.html?appId=${encodeURIComponent(appId)}&documentId=${encodeURIComponent(d.documentId)}">${escapeHtml(d.title)}</a>${d.archivedAt ? ' <span class="badge inactive">Archived</span>' : ""}</td>
                        <td>${escapeHtml(d.templateName) || '<span class="muted">-</span>'}</td>
                        <td><span class="badge ${d.status === "SIGNED" ? "active" : "inactive"}">${escapeHtml(d.status)}</span></td>
                        <td class="muted">${escapeHtml(formatLocalTime(d.createdAt))}</td>
                        <td><button class="small" onclick="toggleDocumentArchived('${d.documentId}', ${!!d.archivedAt})">${d.archivedAt ? "Unarchive" : "Archive"}</button></td>
                    </tr>`).join("");
            renderPagination(result, "documents-page-info", "documents-page-btns", "document", loadDocuments);
        }

        async function toggleDocumentArchived(documentId, currentlyArchived) {
            try {
                await tsiCall("/api/v1/documents", currentlyArchived ? "unarchive_document" : "archive_document", {
                    appId, documentId
                });
                await loadDocuments(documentsPage);
            } catch (err) {
                showNotice(notice, err.message);
            }
        }

        document.getElementById("show-archived-checkbox").addEventListener("change", () => {
            loadDocuments(1).catch(err => showNotice(notice, err.message));
        });

        let searchDebounce = null;
        document.getElementById("search-input").addEventListener("input", () => {
            clearTimeout(searchDebounce);
            searchDebounce = setTimeout(() => {
                loadDocuments(1).catch(err => showNotice(notice, err.message));
            }, 300);
        });

        document.getElementById("new-document-btn").addEventListener("click", () => {
            document.getElementById("generate-document-notice").style.display = "none";
            openModal("create-modal");
        });

        document.getElementById("generate-document-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const genNotice = document.getElementById("generate-document-notice");
            showNotice(genNotice, "");
            const templateId = document.getElementById("gen-doc-template").value;
            if (!templateId) {
                showNotice(genNotice, "Create a template first.");
                return;
            }
            let payloadData;
            try {
                payloadData = JSON.parse(document.getElementById("gen-doc-payload").value || "{}");
            } catch (err) {
                showNotice(genNotice, "Payload data must be valid JSON.");
                return;
            }
            try {
                const result = await tsiCall("/api/v1/templates", "generate_document", {
                    appId, templateId,
                    documentTitle: document.getElementById("gen-doc-title").value,
                    payloadData
                });
                window.location.href = `document-detail.html?appId=${encodeURIComponent(appId)}&documentId=${encodeURIComponent(result.documentId)}`;
            } catch (err) {
                showNotice(genNotice, err.message);
            }
        });

        (async function init() {
            try {
                const apps = (await tsiCall("/api/v1/admin/apps", "list_apps", { limit: 500 })).apps;
                if (apps.length === 0) {
                    document.getElementById("empty-state").style.display = "block";
                    document.getElementById("new-document-btn").disabled = true;
                    return;
                }
                if (!appId || !apps.some(a => a.appId === appId)) {
                    appId = apps[0].appId;
                }
                const select = document.getElementById("app-select");
                select.innerHTML = apps.map(a => `<option value="${escapeHtml(a.appId)}">${escapeHtml(a.appName)}</option>`).join("");
                select.value = appId;
                select.addEventListener("change", () => selectApp(select.value));

                document.getElementById("content").style.display = "block";
                await Promise.all([loadDocuments(), loadTemplatesForSelect()]);
            } catch (err) {
                showNotice(notice, err.message);
            }
        })();
    </script>
</body>
</html>
