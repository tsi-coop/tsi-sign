<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TSI Sign Admin Console</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#172033;background:#f3f7f8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
        .mark{width:40px;height:40px;border-radius:10px;background:#006a67;color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px}
        .loading{font-size:12px;font-weight:700;color:#607086;letter-spacing:.05em;text-transform:uppercase}
    </style>
</head>
<body>
    <span class="mark">TS</span>
    <span class="loading">Loading…</span>
</body>
<script src="assets/console.js"></script>
<script>
    // Check auth state before redirecting, instead of always bouncing to
    // dashboard.html first - that would fire an unauthenticated call (401)
    // on every fresh visit before landing on login.html. The body above is
    // never actually blank while this check is in flight (was previously
    // an empty <body></body>, which rendered as a bare white flash).
    (async function () {
        try {
            await tsiCall("/api/v1/admin/auth", "me", {}, true);
            window.location.replace("dashboard.html");
        } catch (e) {
            window.location.replace("login.html");
        }
    })();
</script>
</html>
