<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TSI Sign Admin Console</title>
</head>
<body></body>
<script>
    // Check auth state before redirecting, instead of always bouncing to
    // apps.html first — that would fire an unauthenticated fetch (401) on
    // every fresh visit before landing on login.html.
    (async function () {
        try {
            const res = await fetch("/api/v1/admin/auth/me");
            window.location.replace(res.ok ? "apps.html" : "login.html");
        } catch (e) {
            window.location.replace("login.html");
        }
    })();
</script>
</html>
