<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Legal Evidence - TSI Sign Admin Console</title>
    <link rel="stylesheet" href="assets/console.css">
</head>
<body>
    <header class="mobilebar">
        <a class="brand" href="dashboard.html"><span class="mark">TS</span><span>TSI Sign</span></a>
    </header>
    <div class="app">
        <aside class="side">
            <a class="brand" href="dashboard.html"><span class="mark">TS</span><span>TSI Sign</span></a>
            <nav class="nav">
                <a href="dashboard.html">Dashboard</a>
                <a href="apps.html">Apps</a>
                <a href="templates.html">Templates</a>
                <a href="documents.html">Documents</a>
                <a href="legal-evidence.html" class="active">Legal</a>
                <a href="users.html" class="platform-admin-only">Users</a>
            </nav>
            <div class="side-foot">
                <div class="side-user-row">
                    <div id="sidebar-user-avatar" class="avatar">-</div>
                    <div style="min-width:0; flex:1;">
                        <div id="sidebar-user-name" class="side-user-name"></div>
                        <div id="sidebar-user-role" class="side-user-role"></div>
                    </div>
                </div>
                <a href="#" onclick="logout(); return false;" class="signout">Sign Out</a>
            </div>
        </aside>

        <main class="main">
        <div class="eyebrow">Admin Console</div>
        <h1>Legal Evidence</h1>
        <p class="subtitle">Every BSA &sect;63 Part A/B certificate issued across all Apps.</p>

        <div id="notice" class="notice error" style="display:none;"></div>

        <div class="panel">
            <table>
                <thead><tr><th>Document</th><th>App</th><th>Version</th><th>Certificate Hash</th><th>Generated</th></tr></thead>
                <tbody id="registry-body"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
            </table>
        </div>
        </main>
    </div>

    <script src="assets/console.js"></script>
    <script>
        loadTopbar();
        const notice = document.getElementById("notice");

        async function load() {
            const entries = await tsiCall("/api/v1/admin/legal-certificates", "list_registry", {});
            const body = document.getElementById("registry-body");
            body.innerHTML = entries.length === 0
                ? '<tr><td colspan="5" class="muted">No legal certificates issued yet.</td></tr>'
                : entries.map(e => `
                    <tr>
                        <td><a href="legal-certificate-detail.html?certificateId=${encodeURIComponent(e.certificateId)}">${escapeHtml(e.documentTitle)}</a></td>
                        <td>${escapeHtml(e.appName)}</td>
                        <td>${e.version}</td>
                        <td style="font-family:ui-monospace,monospace; font-size:12px;">${escapeHtml(e.certificateHash).slice(0, 16)}…</td>
                        <td class="muted">${escapeHtml(e.createdAt)}</td>
                    </tr>`).join("");
        }

        load().catch(err => showNotice(notice, err.message));
    </script>
</body>
</html>
