<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TSI Sign</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#172033;background:#f3f7f8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
        .mark{width:40px;height:40px;border-radius:10px;background:#006a67;color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px}
        .loading{font-size:12px;font-weight:700;color:#607086;letter-spacing:.05em;text-transform:uppercase}
        a{color:#006a67}
    </style>
</head>
<body>
    <span class="mark">TS</span>
    <span class="loading">Loading…</span>
    <noscript><a href="console/login.html">Continue to the admin console</a></noscript>
</body>
<script>
    // Resolves straight to dashboard/login here instead of forwarding to
    // console/index.html (which would then redo this same auth check) -
    // one transitional screen, not two, and it's never blank while the
    // check is in flight (see the <body> content above).
    (async function () {
        try {
            const res = await fetch("/api/v1/admin/auth", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ _func: "me" })
            });
            if (!res.ok) throw new Error("not authenticated");
            window.location.replace("console/dashboard.html");
        } catch (e) {
            window.location.replace("console/login.html");
        }
    })();
</script>
</html>
