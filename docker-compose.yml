# TSI Sign - Docker Compose
#
# Host ports default to 5440 (Postgres) / 8088 (app) — several other TSI
# products (tsi-dpdp-cms, tsi-nexus, tsi-compass, tsi-privacy-vault,
# tsi-ledger, relicredit) commonly run side by side on the same evaluation
# host and already claim 5432-5439 / 8080-8087. Override via DB_PORT_MAP /
# APP_PORT_MAP in .env if these also collide with something on your machine.

x-db-credentials: &db-credentials
  POSTGRES_DB: "${POSTGRES_DB:-tsi_sign}"
  POSTGRES_USER: "${POSTGRES_USER:-tsi_sign_admin}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWD:-secure_dev_password}"

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: tsi_sign_postgres
    restart: unless-stopped
    environment:
      <<: *db-credentials
    ports:
      - "${DB_PORT_MAP:-5440:5432}"
    volumes:
      - sign_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sign_network

  jetty_app:
    #image: "${APP_IMAGE:-tsicoop/tsi-sign:latest}"
    # Uncomment to build from local source instead of pulling the image above:
    build:
        context: .
        dockerfile: Dockerfile
    container_name: tsi_sign_engine
    restart: unless-stopped
    ports:
      - "${APP_PORT_MAP:-8088:8080}"
    environment:
      POSTGRES_HOST: "jdbc:postgresql://postgres_db:5432"
      POSTGRES_DB: "${POSTGRES_DB:-tsi_sign}"
      POSTGRES_USER: "${POSTGRES_USER:-tsi_sign_admin}"
      POSTGRES_PASSWD: "${POSTGRES_PASSWD:-secure_dev_password}"
      TSI_SIGN_ENV: "${TSI_SIGN_ENV:-local}"
      STORAGE_LOCAL_FS_PATH: "${STORAGE_LOCAL_FS_PATH:-/data/tsi-sign/documents}"
      KEYSTORE_PATH: "${KEYSTORE_PATH:-/etc/tsi-sign/keystore.p12}"
      KEYSTORE_TYPE: "${KEYSTORE_TYPE:-PKCS12}"
      KEYSTORE_PASSWORD: "${KEYSTORE_PASSWORD:-changeit}"
      DEFAULT_KEY_ALIAS: "${DEFAULT_KEY_ALIAS:-tsi_corporate_seal}"
      # Signs admin-console session JWTs (§10) - override via .env for any real deployment.
      JWT_SECRET: "${JWT_SECRET:-dev_insecure_jwt_secret_change_in_production}"
      # Browser-reachable base URL of this server: the eSign redirect page and the CA's
      # return URL are built from it (the signer's browser carries both legs).
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8088}"
      # eSign provider used when neither the request nor the App names one. The bundled
      # sandbox is a MOCK CA - point real Apps at emudhra/cdac/protean/vsign/... instead.
      DEFAULT_ESIGN_PROVIDER_ID: "${DEFAULT_ESIGN_PROVIDER_ID:-sandbox}"
      # Optional RFC 3161 time-stamping (PAdES-B-T). Off unless TSA_URL is set; TSA_TRUST_CERTS
      # (the TSA's CA, PEM) is then required. Not enabled by default: the bundled sandbox's TSA
      # is a mock, and a time-stamp from it is not evidence of anything.
      TSA_URL: "${TSA_URL:-}"
      TSA_TRUST_CERTS: "${TSA_TRUST_CERTS:-}"
      TSA_REQUIRED: "${TSA_REQUIRED:-false}"
      ESIGN_SANDBOX_URL: "${ESIGN_SANDBOX_URL:-http://localhost:8091/esign/2.1/form/signdoc}"
      ESIGN_SANDBOX_ASP_ID: "${ESIGN_SANDBOX_ASP_ID:-TSI-SANDBOX-ASP}"
      ESIGN_SANDBOX_TRUST_CERTS: /etc/tsi-sign/sandbox-ca/root.pem
      ESIGN_SANDBOX_ESP_CERT: /etc/tsi-sign/sandbox-ca/esp.pem
    volumes:
      - sign_documents:/data/tsi-sign/documents
      - sandbox_ca:/etc/tsi-sign/sandbox-ca:ro
    depends_on:
      postgres_db:
        condition: service_healthy
      esign_sandbox:
        condition: service_started
    networks:
      - sign_network

  # Mock CCA-licensed eSign Service Provider + CA (sandbox/). For development and
  # evaluation ONLY: it performs no real Aadhaar authentication and its CA is not
  # trusted by anything. Drop this service (and DEFAULT_ESIGN_PROVIDER_ID) once a real
  # CA's ESIGN_<PROVIDER>_* settings are configured.
  esign_sandbox:
    build:
      context: ./sandbox
    container_name: tsi_sign_esign_sandbox
    restart: unless-stopped
    ports:
      - "${SANDBOX_PORT_MAP:-8091:8091}"
    environment:
      PORT: "8091"
      SANDBOX_CA_DIR: /data/ca
    volumes:
      - sandbox_ca:/data/ca
    networks:
      - sign_network

networks:
  sign_network:
    driver: bridge

volumes:
  sign_data:
    driver: local
  sign_documents:
    driver: local
  sandbox_ca:
    driver: local
